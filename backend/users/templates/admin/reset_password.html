{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="module">
  <h2>{{ title }}</h2>
  <p>Пользователь: <strong>{{ user.login }}</strong></p>

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="form" value="1">

    <div style="margin-bottom: 16px;">
      <label for="id_new_password" style="display: block; margin-bottom: 4px; font-weight: bold;">
        Новый пароль:
      </label>
      <input type="password" name="new_password" id="id_new_password" required
             style="width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 16px;">
      <label for="id_new_password_confirm" style="display: block; margin-bottom: 4px; font-weight: bold;">
        Подтвердите новый пароль:
      </label>
      <input type="password" name="new_password_confirm" id="id_new_password_confirm" required
             style="width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <input type="submit" name="_confirm_reset" value="Сбросить пароль" class="default">
    <a href="{% url 'admin:users_user_changelist' %}" class="button" style="margin-left: 10px;">Отмена</a>
  </form>
</div>
{% endblock %}
